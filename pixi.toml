[workspace]
channels = ["conda-forge"]
name = "fimbox"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
fimbox = "fimbox"
api = "python -m uvicorn fimbox_api.main:app --app-dir src --no-access-log"
sdk-generate = "uv tool run --from openapi-python-client==0.28.0 openapi-python-client generate --path sdk/openapi.json --config sdk/generator.yaml --meta none --output-path src/fimbox_sdk --overwrite --fail-on-warning"

[dependencies]
python = "==3.14"
rich = ">=15.0.0,<16"
typer = ">=0.27.2,<0.28"
pydantic = ">=2.0,<3"

[pypi-dependencies]
fimbox = { path = ".", editable = true }
fastapi = "==0.115.12"
uvicorn = { version = "==0.34.3", extras = ["standard"] }
celery = { version = "==5.5.3", extras = ["redis"] }
redis = "==5.2.1"
pydantic-settings = "==2.9.1"
boto3 = "==1.35.99"
httpx = "==0.28.1"
python-multipart = "==0.0.20"
