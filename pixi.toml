[workspace]
channels = ["conda-forge"]
name = "fimbox"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
fimbox = "fimbox"
api = "python -m uvicorn fimbox_api.main:app --app-dir src --no-access-log"
sdk-generate = "uv tool run --from openapi-python-client==0.28.0 python sdk/generate.py"

[dependencies]
python = "==3.14"
pydantic = ">=2.0,<3"
uv = ">=0.13.1,<0.14"
pip = ">=26.2.1,<27"

[pypi-dependencies]
fimbox = { path = ".", editable = true }
fastapi = "==0.115.12"
uvicorn = { version = "==0.34.3", extras = ["standard"] }
celery = { version = "==5.5.3", extras = ["redis"] }
redis = "==5.2.1"
pydantic-settings = "==2.9.1"
boto3 = "==1.35.99"
httpx = "==0.28.1"
python-multipart = "==0.0.20"
